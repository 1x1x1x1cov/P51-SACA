<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AMMU</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #333;
  }

  #chat {
    max-width: 500px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #ccc;
    height: 400px;
    overflow-y: auto;
    padding: 12px;
    border-radius: 6px;
  }

  .msg {
    margin: 8px 0;
    padding: 10px;
    border-radius: 6px;
    white-space: pre-wrap;
    max-width: 85%;
  }

  .user {
    background: #d9edff;
    margin-left: auto;
    text-align: right;
  }

  .ammu {
    background: #eee;
  }

  /* the example chips */
  #examples {
    max-width: 500px;
    margin: 10px auto 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 16px;
    padding: 6px 12px;
    font-size: 13px;
    color: #333;
    cursor: pointer;
  }

  .chip:hover {
    background: #e0f2f1;
    border-color: #009688;
  }

  #bottom {
    max-width: 500px;
    margin: 10px auto;
    display: flex;
    gap: 8px;
  }

  #input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  #send {
    padding: 10px 16px;
    border: none;
    background: #009688;
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
  }

  .hint {
    max-width: 500px;
    margin: 0 auto 10px auto;
    font-size: 13px;
    color: #777;
    text-align: center;
  }
</style>
</head>
<body>

<h1>AMMU</h1>
<p class="hint">Type how you feel, or tap an example below</p>

<div id="chat"></div>

<div id="examples"></div>

<div id="bottom">
  <input id="input" placeholder="Say how you feel...">
  <button id="send">Send</button>
</div>

<script>
const API = "http://127.0.0.1:8000/classify";

const chat = document.getElementById("chat");
const input = document.getElementById("input");

// example lines people can tap
const examples = [
  "ana homa na maumivu ya kichwa",
  "ana kikohozi na kupumua haraka",
  "ana homa na degedege",
  "ana kikohozi kidogo"
];

// color for each level
const colors = {
  LOW: "#2e7d32",
  MEDIUM: "#e6b800",
  HIGH: "#d32f2f",
  CRITICAL: "#7a0000"
};

// what AMMU says for each level
const replies = {
  LOW: "This looks minor. Try to rest and drink some water, and keep an eye on how you feel.",
  MEDIUM: "This is something to watch. Take it easy today. If it gets worse, go see a health worker.",
  HIGH: "This needs attention. You should see a doctor soon.",
  CRITICAL: "This looks serious. Please go to a medical facility right away."
};

const facility = "Nearest facility: Mbinga District Hospital, about 12 km away.";

// pairs that don't go together. add more if needed.
const contradictions = [
  ["joto", "baridi"]   // hot and cold at the same time
];

let emptyCount = 0;
let confirmAsked = false;

// build the example chips
const examplesBox = document.getElementById("examples");
for (const ex of examples) {
  const chip = document.createElement("div");
  chip.className = "chip";
  chip.textContent = ex;
  chip.onclick = function() {
    input.value = ex;
    send();
  };
  examplesBox.appendChild(chip);
}

function addMessage(text, who, color) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  if (color) {
    div.style.borderLeft = "6px solid " + color;
  }
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function hasContradiction(text) {
  const t = text.toLowerCase();
  for (const pair of contradictions) {
    if (t.includes(pair[0]) && t.includes(pair[1])) {
      return true;
    }
  }
  return false;
}

function listSymptoms(list) {
  const nice = list.map(s => s.replace(/_/g, " "));
  if (nice.length === 1) {
    return nice[0];
  }
  return nice.slice(0, -1).join(", ") + " and " + nice[nice.length - 1];
}

async function send() {
  const text = input.value.trim();

  if (text === "") {
    emptyCount++;
    if (emptyCount >= 2) {
      addMessage("Okay, I will wait. Say Hi AMMU when you are ready.", "ammu");
      emptyCount = 0;
    } else {
      addMessage("Sorry, I did not catch that. Can you tell me how you are feeling?", "ammu");
    }
    return;
  }

  addMessage(text, "user");
  input.value = "";

  if (hasContradiction(text)) {
    if (!confirmAsked) {
      confirmAsked = true;
      addMessage("Just to make sure I understood, you said you feel hot and also cold? Can you say that again for me?", "ammu");
      return;
    } else {
      confirmAsked = false;
      addMessage("I want to make sure you are okay. Since I am not fully sure what is going on, it is best to see a health worker.", "ammu");
      return;
    }
  }
  confirmAsked = false;

  const thinking = addMessage("Let me check that for you...", "ammu");

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symptom_text: text })
    });
    const data = await res.json();
    thinking.remove();

    if (!data.symptoms || data.symptoms.length === 0) {
      emptyCount++;
      if (emptyCount >= 2) {
        addMessage("It is okay if it is hard to explain. If you keep feeling bad, please rest, and see a health worker if it does not get better.", "ammu");
        emptyCount = 0;
      } else {
        addMessage("Sorry, I did not catch that. Can you tell me more? For example, do you have a fever, a cough, or pain somewhere?", "ammu");
      }
      return;
    }

    emptyCount = 0;

    if (data.symptoms.length >= 2) {
      addMessage("Okay, so you have " + listSymptoms(data.symptoms) + ". Let me check that for you.", "ammu");
    }

    let reply = replies[data.severity];
    reply += "\n\nReason: " + data.reason;

    if (data.severity === "HIGH" || data.severity === "CRITICAL") {
      reply += "\n\n" + facility;
    }

    reply += "\n\nRemember, I am not a doctor. For serious problems please see a real health worker.";

    addMessage(reply, "ammu", colors[data.severity]);

  } catch (e) {
    thinking.remove();
    addMessage("I could not connect to the server. Make sure it is running (uvicorn main:app --reload).", "ammu");
  }
}

document.getElementById("send").onclick = send;

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    send();
  }
});
</script>

</body>
</html>
