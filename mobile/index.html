<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SACA</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f766e; color: #fff; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  #saca-boot { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; box-sizing: border-box; }
  #saca-boot .logo { width: 84px; height: 84px; border-radius: 22px; background: #fff; color: #0f766e; font: 800 46px/84px system-ui, sans-serif; }
  #saca-boot h1 { margin: 0; font-size: 30px; }
  #saca-boot p { margin: 0; font-size: 17px; opacity: .92; max-width: 320px; }
  #saca-boot .bar { width: 220px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
  #saca-boot .bar i { display: block; height: 100%; width: 40%; background: #fff; border-radius: 3px; animation: slide 1.2s ease-in-out infinite; }
  #saca-boot pre { white-space: pre-wrap; text-align: left; font-size: 12px; max-width: 92vw; background: rgba(0,0,0,.25); padding: 10px; border-radius: 8px; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
</style>
</head>
<body>
<div id="saca-boot">
  <div class="logo">S</div>
  <h1>SACA</h1>
  <p id="saca-status">Starting... / Inaanza...</p>
  <div class="bar"><i></i></div>
</div>
<script src="pyodide/pyodide.js"></script>
<script src="boot.js"></script>
</body>
</html>
